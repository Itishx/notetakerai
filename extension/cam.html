<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Braino — Camera</title>
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0807;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    #v { width: 100%; height: 100%; object-fit: cover; display: none;
      transform: scaleX(-1); background: #0b0807; }
    #ask { position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 9px; padding: 12px;
      box-sizing: border-box; text-align: center; color: #f6ece9; }
    #grant { appearance: none; border: 0; cursor: pointer; font-weight: 600; font-size: 12px;
      color: #fff; background: linear-gradient(135deg, #ff7a59, #c8544a);
      padding: 9px 15px; border-radius: 10px; box-shadow: 0 4px 16px rgba(200,84,74,0.45); }
    #grant:hover { filter: brightness(1.06); }
    #hint { font-size: 10px; line-height: 1.45; color: #cbb6b0; max-width: 180px; }
  </style>
</head>
<body>
  <video id="v" autoplay playsinline muted></video>
  <div id="ask">
    <button id="grant">Enable camera</button>
    <div id="hint">Tap to let Braino see — then choose <b>Allow</b>.</div>
  </div>
  <script src="cam.js"></script>
</body>
</html>
