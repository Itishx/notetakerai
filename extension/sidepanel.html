<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LectureSnap</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="sidepanel">
  <!-- History Overlay -->
  <div id="historyOverlay" class="history-overlay hidden">
    <div class="history-panel">
      <div class="history-panel-header">
        <button id="historyBackBtn" class="btn-icon-sm" title="Close">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12,19 5,12 12,5"/></svg>
        </button>
        <h2>All Notes</h2>
        <button id="clearHistoryBtn" class="btn-clear">Clear All</button>
      </div>
      <div id="historyList" class="history-list"></div>
    </div>
  </div>

  <div class="container">
    <div class="header" style="position: relative;">
      <div class="orb-container">
        <div class="orb-layer orb-outer"></div>
        <div class="orb-layer orb-mid"></div>
        <div class="orb-layer orb-core"></div>
      </div>
      <div class="header-top" style="position: relative; z-index: 1;">
        <div class="logo-group">
          <div class="logo">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
              <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
              <line x1="12" x2="12" y1="19" y2="22"/>
            </svg>
          </div>
          <div>
            <h1>LectureSnap</h1>
            <p class="subtitle">AI-Powered Lecture Notes</p>
          </div>
        </div>
        <div class="header-actions">
          <button id="historyBtn" class="btn-icon hidden" title="View History">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><polyline points="12,6 12,12 16,14"/></svg>
          </button>
          <button id="newSessionBtn" class="btn-icon hidden" title="New Recording Session">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          </button>
        </div>
      </div>
    </div>

    <div id="status" class="status idle">
      <div class="status-dot"></div>
      <span>Ready to record</span>
    </div>

    <div class="timer" id="timer">00:00</div>
    <div id="segmentCount" class="segment-count hidden"></div>

    <div class="controls">
      <button id="recordBtn" class="btn btn-record">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="8"/></svg>
        Start Recording
      </button>
      <button id="continueBtn" class="btn btn-record hidden">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="8"/></svg>
        Continue Recording
      </button>
      <button id="stopBtn" class="btn btn-stop hidden" disabled>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
        Pause & Save Segment
      </button>
    </div>

    <button id="convertBtn" class="btn btn-convert" disabled>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14,2 14,8 20,8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10,9 9,9 8,9"/></svg>
      Convert to Notes
    </button>

    <div id="loading" class="loading hidden">
      <div class="spinner"></div>
      <p>Transcribing & generating notes...</p>
    </div>

    <div id="notesSection" class="notes-section hidden">
      <h2>Your Notes</h2>
      <div id="notesContent" class="notes-content rendered-md"></div>
      <div class="notes-actions">
        <button id="copyBtn" class="btn btn-secondary">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          Copy Markdown
        </button>
        <button id="syncNotionBtn" class="btn btn-accent">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v16H4z"/><path d="M9 4v16"/><path d="M14 10l-5 4"/></svg>
          <span id="syncNotionLabel">Sync to Notion</span>
        </button>
      </div>
    </div>

    <!-- Chat Section -->
    <div id="chatSection" class="chat-section hidden">
      <div class="chat-divider">
        <span>Chat with AI about your notes</span>
      </div>
      <div id="chatMessages" class="chat-messages"></div>
      <div id="chatImagePreview" class="chat-image-preview hidden">
        <img id="chatPreviewImg" src="" alt="preview" />
        <button id="chatRemoveImage" class="btn-icon-sm" title="Remove image">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="chat-input-bar">
        <button id="chatScreenshotBtn" class="btn-icon-sm" title="Take screenshot from page">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
        </button>
        <button id="chatAttachBtn" class="btn-icon-sm" title="Attach image file">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
        </button>
        <input type="text" id="chatInput" placeholder="Ask about these notes..." autocomplete="off" />
        <button id="chatSendBtn" class="btn-icon-sm btn-send" title="Send">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22,2 15,22 11,13 2,9"/></svg>
        </button>
      </div>
      <input type="file" id="chatFileInput" accept="image/*" class="hidden" />
    </div>

    <!-- Screenshot Crop Overlay -->
    <div id="cropOverlay" class="crop-overlay hidden">
      <div class="crop-header">
        <span>Drag to select area, or use full screenshot</span>
        <div class="crop-header-actions">
          <button id="cropUseFullBtn" class="btn btn-secondary btn-sm">Use Full Screenshot</button>
          <button id="cropConfirmBtn" class="btn btn-record btn-sm" disabled>Crop & Insert</button>
          <button id="cropCancelBtn" class="btn-icon-sm" title="Cancel">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
      </div>
      <div id="cropCanvas" class="crop-canvas">
        <img id="cropImage" src="" alt="screenshot" />
        <div id="cropSelection" class="crop-selection hidden"></div>
      </div>
    </div>

    <div class="footer">
      <p>Supports YouTube · Udemy · DataCamp</p>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
