# Edge functions are grouped into category folders under supabase/functions/<category>/<slug>/.
# The deployed slug (and its /functions/v1/<slug> URL) is the [functions.<slug>] key below;
# `entrypoint` points the CLI at the relocated source. verify_jwt=false = intentionally public
# (OAuth callbacks, webhooks, public stats, server-key TTS). Omitted verify_jwt defaults to true.

