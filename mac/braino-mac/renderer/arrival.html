<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>Arrival</title>
  <style>
    /* Arrival: the notch greets you when you come back. Ported from the
       approved animation (claude.ai artifact "AffectiveOS Arrival"). */
    :root {
      --ink:#F5F5F7; --ink-2:#AEAEB2; --ink-3:#6E6E73; --line:#2C2C2E;
      --amber:#FFB547; --mint:#5BE3A6; --island:#000;
      --sf-display:"SF Pro Display",-apple-system,BlinkMacSystemFont,sans-serif;
      --sf-text:"SF Pro Text",-apple-system,BlinkMacSystemFont,sans-serif;
      --spring:cubic-bezier(.34,1.4,.5,1); --spring-dur:.7s;
      --top:0px;
    }
    html, body { margin:0; background:transparent; overflow:hidden; height:100%; }
    body { font-family:var(--sf-text); color:var(--ink); -webkit-font-smoothing:antialiased; user-select:none; }

    .glow { position:absolute; left:50%; top:0; width:var(--w); height:var(--h); transform:translateX(-50%); border-radius:0 0 50% 50%;
      background:var(--tint,transparent); filter:blur(34px); opacity:0; pointer-events:none;
      transition:width var(--spring-dur) var(--spring),height var(--spring-dur) var(--spring),opacity .6s ease,background .6s ease; }
    .glow.on { opacity:.5; }
    .island { position:absolute; left:50%; top:0; width:var(--w); height:var(--h); transform:translateX(-50%); background:var(--island);
      border-radius:0 0 var(--r) var(--r); outline:none;
      transition:width var(--spring-dur) var(--spring),height var(--spring-dur) var(--spring),border-radius var(--spring-dur) var(--spring);
      box-shadow:inset 0 -1px 0 rgba(255,255,255,.07),0 18px 40px -14px rgba(0,0,0,.9); }
    .island::before, .island::after { content:""; position:absolute; top:0; width:14px; height:14px; pointer-events:none; }
    .island::before { left:-14px; background:radial-gradient(circle at 0 100%,transparent 13.5px,var(--island) 14px); }
    .island::after { right:-14px; background:radial-gradient(circle at 100% 100%,transparent 13.5px,var(--island) 14px); }
    .clip { position:absolute; inset:0; overflow:hidden; border-radius:inherit; }

    .lay { position:absolute; left:0; right:0; bottom:0; top:var(--top); display:flex; align-items:center; justify-content:center;
      opacity:0; filter:blur(8px); transform:scale(.94); pointer-events:none;
      transition:opacity .28s ease,filter .28s ease,transform .45s var(--spring); }
    .lay.on { opacity:1; filter:blur(0); transform:scale(1); transition-delay:.14s; pointer-events:auto; }

    .scan { gap:11px; }
    .scan .t { font-size:14px; font-weight:500; background:linear-gradient(90deg,#8E8E93 0%,#F5F5F7 45%,#8E8E93 90%); background-size:200% 100%;
      -webkit-background-clip:text; background-clip:text; color:transparent; animation:shimmer 1.6s linear infinite; }
    @keyframes shimmer { from { background-position:120% 0; } to { background-position:-80% 0; } }
    .glyph { position:relative; width:26px; height:26px; }
    .glyph svg { position:absolute; inset:0; }
    .glyph .spin { animation:spin 1.1s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }

    .big { justify-content:flex-start; gap:22px; padding:0 34px; }
    .stack { display:flex; flex-direction:column; gap:6px; min-width:0; }
    .title { font-family:var(--sf-display); font-weight:600; font-size:30px; letter-spacing:-.02em; line-height:1.1; white-space:nowrap; }
    .line { font-size:15px; line-height:1.4; color:var(--ink-2); }
    .ring circle.arc { stroke-dasharray:176; stroke-dashoffset:176; }
    .ring path { stroke-dasharray:40; stroke-dashoffset:40; }
    .lay.on .ring circle.arc { animation:draw .7s cubic-bezier(.6,0,.2,1) .2s forwards; }
    .lay.on .ring path { animation:draw .35s ease-out .75s forwards; }
    @keyframes draw { to { stroke-dashoffset:0; } }

    .welcome { flex-direction:column; align-items:stretch; justify-content:flex-start; gap:18px; padding:22px 34px 0; }
    .head { display:flex; align-items:center; gap:20px; }
    .rows { display:flex; flex-direction:column; gap:8px; }
    .row { display:flex; align-items:center; gap:12px; height:32px; font-size:15px; color:var(--ink); opacity:0; transform:translateY(6px);
      transition:opacity .3s ease,transform .45s var(--spring); }
    .island[data-state="summary"] .row { opacity:1; transform:none; }
    .island[data-state="summary"] .row:nth-child(1) { transition-delay:.18s; }
    .island[data-state="summary"] .row:nth-child(2) { transition-delay:.3s; }
    .island[data-state="summary"] .row:nth-child(3) { transition-delay:.42s; }
    .island[data-state="summary"] .row:nth-child(4) { transition-delay:.54s; }
    .ico { width:32px; height:32px; border-radius:10px; display:grid; place-items:center; flex-shrink:0; background:#161618; }
    .row span { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .fp { position:relative; width:60px; height:60px; flex-shrink:0; }
    .fp svg { position:absolute; inset:0; }
    .fp .fill { clip-path:inset(100% 0 0 0); }
    .fp.waiting .fill { animation:breathe 1.6s ease-in-out infinite; }
    @keyframes breathe { 0%,100% { clip-path:inset(85% 0 0 0); } 50% { clip-path:inset(35% 0 0 0); } }
    .fp.done .fill { clip-path:inset(0 0 0 0); animation:none; }
    .fp .fill path { transition:stroke .3s; }
    .fp.done .fill path { stroke:var(--mint); }

    .inl { gap:10px; }
    .dot { width:8px; height:8px; border-radius:50%; background:var(--mint); box-shadow:0 0 12px var(--mint); }
    .inl .t { font-size:14px; font-weight:500; }

    @media (prefers-reduced-motion: reduce) {
      .glyph .spin, .scan .t, .fp.waiting .fill { animation:none; }
      :root { --spring-dur:.2s; }
    }
  </style>
</head>
<body>
  <div class="glow" id="glow"></div>
  <div class="island" id="island" data-state="rest">
    <div class="clip">
      <div class="lay scan" data-for="scanning">
        <div class="glyph">
          <svg width="26" height="26" viewBox="0 0 26 26" fill="none" aria-hidden="true"><path d="M8 11.5v1M18 11.5v1M13 11v3.5h-1.2M10.3 17.2a4 4 0 0 0 5.4 0" stroke="#F5F5F7" stroke-width="1.5" stroke-linecap="round"/></svg>
          <svg class="spin" width="26" height="26" viewBox="0 0 26 26" fill="none" aria-hidden="true"><circle cx="13" cy="13" r="11.5" stroke="#FFB547" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="18 54"/></svg>
        </div>
        <span class="t">Looking for you</span>
      </div>

      <div class="lay big" data-for="touchid">
        <div class="fp" id="fp">
          <svg viewBox="0 0 24 24" fill="none" stroke="#3A3A3C" stroke-width="1.35" stroke-linecap="round" aria-hidden="true"><path d="M12 11c0 3.5-1 6.5-2.5 9"/><path d="M8.5 7.8A5 5 0 0 1 17 11c0 1.6-.1 3.2-.5 4.7"/><path d="M5.5 16.5c.6-1.7 1-3.5 1-5.5a5.5 5.5 0 0 1 1-3.2"/><path d="M15.2 13.5c-.2 2.4-.9 4.7-2 6.7"/><path d="M4 8.6A9 9 0 0 1 20.5 9"/><path d="M20.8 13c-.1 1.2-.3 2.4-.6 3.5"/></svg>
          <svg class="fill" viewBox="0 0 24 24" fill="none" stroke="#FFB547" stroke-width="1.35" stroke-linecap="round" aria-hidden="true"><path d="M12 11c0 3.5-1 6.5-2.5 9"/><path d="M8.5 7.8A5 5 0 0 1 17 11c0 1.6-.1 3.2-.5 4.7"/><path d="M5.5 16.5c.6-1.7 1-3.5 1-5.5a5.5 5.5 0 0 1 1-3.2"/><path d="M15.2 13.5c-.2 2.4-.9 4.7-2 6.7"/><path d="M4 8.6A9 9 0 0 1 20.5 9"/><path d="M20.8 13c-.1 1.2-.3 2.4-.6 3.5"/></svg>
        </div>
        <div class="stack">
          <div class="title" id="touchTitle">Touch ID to come in</div>
          <div class="line" id="touchLine">Just making sure it is you.</div>
        </div>
      </div>

      <div class="lay welcome" data-for="recognised summary">
        <div class="head">
          <svg class="ring" width="56" height="56" viewBox="0 0 64 64" fill="none" aria-hidden="true" style="flex-shrink:0"><circle cx="32" cy="32" r="28" stroke="#1F3A2E" stroke-width="3"/><circle class="arc" cx="32" cy="32" r="28" stroke="#5BE3A6" stroke-width="3" stroke-linecap="round" transform="rotate(-90 32 32)"/><path d="M21 33l7.5 7.5L44 25" stroke="#5BE3A6" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <div class="stack">
            <div class="title" id="greet">Morning.</div>
            <div class="line" id="lead">Good to have you back.</div>
          </div>
        </div>
        <div class="rows" id="rows"></div>
      </div>

      <div class="lay inl" data-for="in">
        <span class="dot"></span><span class="t" id="welcome">You are in</span>
      </div>
    </div>
  </div>
  <video id="cam" playsinline muted style="display:none"></video>
  <canvas id="frame" width="480" height="360" style="display:none"></canvas>
  <script src="arrival.js"></script>
</body>
</html>
