<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:; font-src 'self'; media-src 'self' data:" />
  <title>Welcome to Braino</title>
  <link rel="stylesheet" href="onboard.css" />
</head>
<body>
  <header class="ob-top">
    <span class="ob-mark">Affective</span>
    <button type="button" class="ob-sound" id="ob-sound">Sound on</button>
  </header>
  <main class="ob-stage" id="ob-stage" aria-live="polite"></main>
  <footer class="ob-foot">
    <button type="button" class="ob-back" id="ob-back">Back</button>
    <div class="ob-dots" id="ob-dots"></div>
    <span class="ob-count" id="ob-count"></span>
  </footer>
  <script src="onboard.js"></script>
</body>
</html>
