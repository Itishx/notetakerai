<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Braino Mac</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./braino-mac.css" />
    <link rel="stylesheet" href="./her-mode.css" />
  </head>
  <body>
    <main id="dock-stage" aria-label="Braino Mac dock companion">
      <div id="edge-glow" aria-hidden="true"></div>
      <div id="notch-face" aria-hidden="true">
        <div class="nf-sonar"><i></i><i></i><i></i></div>
        <div class="nf-pill">
          <svg class="nf-folds" viewBox="0 0 200 74" preserveAspectRatio="none">
            <path d="M 16 2 Q 23 20 16 37 Q 9 54 16 72" fill="none" stroke="#B34A41" stroke-width="2" stroke-linecap="round" opacity="0.55" />
            <path d="M 44 2 Q 37 20 44 37 Q 51 54 44 72" fill="none" stroke="#B34A41" stroke-width="2" stroke-linecap="round" opacity="0.55" />
            <path d="M 72 2 Q 79 20 72 37 Q 65 54 72 72" fill="none" stroke="#B34A41" stroke-width="2" stroke-linecap="round" opacity="0.55" />
            <path d="M 128 2 Q 121 20 128 37 Q 135 54 128 72" fill="none" stroke="#B34A41" stroke-width="2" stroke-linecap="round" opacity="0.55" />
            <path d="M 156 2 Q 163 20 156 37 Q 149 54 156 72" fill="none" stroke="#B34A41" stroke-width="2" stroke-linecap="round" opacity="0.55" />
            <path d="M 184 2 Q 177 20 184 37 Q 191 54 184 72" fill="none" stroke="#B34A41" stroke-width="2" stroke-linecap="round" opacity="0.55" />
            <path d="M 18.4 2 Q 25.4 20 18.4 37 Q 11.4 54 18.4 72" fill="none" stroke="#FBD9D2" stroke-width="1.1" stroke-linecap="round" opacity="0.5" />
            <path d="M 46.4 2 Q 39.4 20 46.4 37 Q 53.4 54 46.4 72" fill="none" stroke="#FBD9D2" stroke-width="1.1" stroke-linecap="round" opacity="0.5" />
            <path d="M 74.4 2 Q 81.4 20 74.4 37 Q 67.4 54 74.4 72" fill="none" stroke="#FBD9D2" stroke-width="1.1" stroke-linecap="round" opacity="0.5" />
            <path d="M 130.4 2 Q 123.4 20 130.4 37 Q 137.4 54 130.4 72" fill="none" stroke="#FBD9D2" stroke-width="1.1" stroke-linecap="round" opacity="0.5" />
            <path d="M 158.4 2 Q 165.4 20 158.4 37 Q 151.4 54 158.4 72" fill="none" stroke="#FBD9D2" stroke-width="1.1" stroke-linecap="round" opacity="0.5" />
            <path d="M 186.4 2 Q 179.4 20 186.4 37 Q 193.4 54 186.4 72" fill="none" stroke="#FBD9D2" stroke-width="1.1" stroke-linecap="round" opacity="0.5" />
          </svg>
          <div class="nf-band">
            <svg class="nf-mini" viewBox="0 0 120 56">
              <g class="nf-ears" opacity="0.32"><ellipse cx="38" cy="30" rx="8" ry="4.5" fill="#E14A48" /><ellipse cx="82" cy="30" rx="8" ry="4.5" fill="#E14A48" /></g>
              <g id="nf-eye-l" class="nf-eye">
                <circle cx="49" cy="22" r="12" fill="#fff" />
                <circle id="nf-pupil-l" cx="49" cy="22" r="6.2" fill="#1B1713" />
                <circle id="nf-glint-l" cx="51.3" cy="19.3" r="2" fill="#fff" />
              </g>
              <g id="nf-eye-r" class="nf-eye">
                <circle cx="71" cy="22" r="12" fill="#fff" />
                <circle id="nf-pupil-r" cx="71" cy="22" r="6.2" fill="#1B1713" />
                <circle id="nf-glint-r" cx="73.3" cy="19.3" r="2" fill="#fff" />
              </g>
              <path class="nf-lid" d="M 36 22 Q 49 28 62 22" fill="none" stroke="#F4E4DC" stroke-width="2.6" stroke-linecap="round" />
              <path class="nf-lid" d="M 58 22 Q 71 28 84 22" fill="none" stroke="#F4E4DC" stroke-width="2.6" stroke-linecap="round" />
              <path id="nf-mouth-idle" d="M 52 41 Q 60 49 68 41" fill="none" stroke="#7E2A24" stroke-width="2.6" stroke-linecap="round" />
              <path id="nf-mouth-listen" d="M 55 43 Q 60 45 65 43" fill="none" stroke="#E8786E" stroke-width="2.4" stroke-linecap="round" style="display:none" />
              <ellipse id="nf-mouth-talk" cx="60" cy="43" rx="4.6" ry="3.2" fill="#E8786E" style="display:none" />
            </svg>
            <div class="nf-viz"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
            <div class="nf-dancer"></div>
          </div>
          <div class="nf-cap nf-cap-l"></div>
          <div id="nf-status"></div>
          <div id="nf-status-2"></div>
          <div class="nf-volume" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="11" height="11"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            <div class="nf-vol-bar"><i></i></div>
            <span class="nf-vol-num"></span>
          </div>
          <div class="nf-drop-hint">drop it, I&rsquo;ll hold it</div>
          <div class="nf-tray" aria-hidden="true">
            <div class="nf-tray-main">
              <div class="nf-np">
                <div class="nf-np-art"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M9 18.5a2.5 2.5 0 1 1-1.5-2.29V6.8l9-2.2v9.6a2.5 2.5 0 1 1-1.5-2.29V8.1l-6 1.47v8.93z" fill="currentColor"/></svg></div>
                <div class="nf-np-meta">
                  <div class="nf-np-track">Nothing playing</div>
                  <div class="nf-np-artist"></div>
                  <div class="nf-np-bar"><i></i></div>
                </div>
                <div class="nf-np-ctl">
                  <button class="nf-ib nf-prev" title="Previous"><svg viewBox="0 0 24 24"><path d="M7 5v14h-1.8V5H7zm12 0v14L8.5 12 19 5z" fill="currentColor"/></svg></button>
                  <button class="nf-ib nf-play" title="Play / Pause"><svg viewBox="0 0 24 24"><path class="nf-ic-play" d="M8 5v14l11-7L8 5z" fill="currentColor"/><g class="nf-ic-pause"><rect x="7" y="5" width="3.6" height="14" rx="1" fill="currentColor"/><rect x="13.4" y="5" width="3.6" height="14" rx="1" fill="currentColor"/></g></svg></button>
                  <button class="nf-ib nf-next" title="Next"><svg viewBox="0 0 24 24"><path d="M17 5v14h1.8V5H17zM5 5v14l10.5-7L5 5z" fill="currentColor"/></svg></button>
                </div>
              </div>
              <div class="nf-side">
                <div class="nf-cal">
                  <div class="nf-cal-when">today</div>
                  <div class="nf-cal-title">No events coming up</div>
                  <button class="nf-join" hidden>Join &amp; record</button>
                </div>
                <div class="nf-timerlist" hidden></div>
                <div class="nf-sys">
                  <span class="nf-batt"></span>
                  <span class="nf-bt"></span>
                </div>
              </div>
            </div>
            <div class="nf-shelf" hidden></div>
          </div>
          <div class="nf-privacy"></div>
          <div class="nf-think-dots"><i></i><i></i><i></i></div>
          <div class="nf-think-arrow"></div>
        </div>
        <!-- The keynote shimmer: a white-to-blue light that traces the island's
             outline, verbatim from the trybraino.com reveal. Fired by JS via
             the .nf-shining class, every ~90s while he's home and idle. -->
        <svg class="nf-shine" viewBox="0 0 190 55" aria-hidden="true">
          <defs>
            <linearGradient id="nf-shine-grad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#FFFFFF" />
              <stop offset="0.45" stop-color="#CFE0FF" />
              <stop offset="0.8" stop-color="#7AA2FF" />
              <stop offset="1" stop-color="#F0A86B" />
            </linearGradient>
          </defs>
          <path class="nf-shine-glow" pathLength="100" d="M 0 0 H 190 V 39 Q 190 55 174 55 H 16 Q 0 55 0 39 Z" stroke="url(#nf-shine-grad)" fill="none" />
          <path class="nf-shine-core" pathLength="100" d="M 0 0 H 190 V 39 Q 190 55 174 55 H 16 Q 0 55 0 39 Z" stroke="url(#nf-shine-grad)" fill="none" />
        </svg>
      </div>
      <section id="status-pill">
        <span id="status-dot"></span>
        <span id="status-text">Starting Braino Mac</span>
      </section>
      <section id="meeting-panel" aria-hidden="true">
        <div class="mp-head">
          <span class="mp-rec"><i></i>REC</span>
          <span class="mp-title">Recording</span>
          <span class="mp-time">0:00</span>
          <span class="mp-invisible" title="Invisible to screen shares">👁 hidden</span>
          <button class="mp-stop" title="Stop recording">Stop</button>
        </div>
        <div class="mp-body">
          <div class="mp-notes-label">Live notes</div>
          <div class="mp-notes"></div>
          <div class="mp-caption"></div>
        </div>
      </section>
      <section id="speech-bubble" aria-live="polite"></section>
      <section id="file-strip"></section>
      <section id="walker-lane">
        <div id="walker">
          <div id="walker-flip"></div>
        </div>
      </section>
    </main>
    <script src="./her-presence.js"></script>
    <script src="./her-mode.js"></script>
    <script type="module" src="./braino-mac.js"></script>
  </body>
</html>
