<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>Type to Braino</title>
  <style>
    /* Type to Braino (2026-10-25): the Chrome extension's Space bar, back.
       One line of glass in the middle of the screen. The blur is macOS's own
       (vibrancy on the window), so it takes its colour from whatever is behind
       it; the text sits on a soft shade of its own so it reads on anything. */
    :root {
      --ink: #ffffff;
      --ink-soft: rgba(255, 255, 255, .56);
      --edge: rgba(255, 255, 255, .22);
      --glow: 91, 156, 255;
    }
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; background: transparent; overflow: hidden;
      font-family: "SF Pro Text", -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased; -webkit-user-select: none; }
    .bar {
      position: absolute; inset: 0;
      display: flex; align-items: center; gap: 14px;
      padding: 0 22px 0 18px;
      inset: 6px;
      border-radius: 999px;
      /* Liquid glass, drawn here (a pill window cannot use macOS's blur): a
         dark, see-through body that reads on white and on black, a bright rim
         on top like light on a lens, and a soft drop under it. */
      background:
        radial-gradient(120% 140% at 50% -40%, rgba(255, 255, 255, .22), rgba(255, 255, 255, 0) 55%),
        linear-gradient(180deg, rgba(28, 30, 40, .62), rgba(16, 17, 24, .74));
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .32), inset 0 0 0 1px var(--edge), 0 12px 32px -10px rgba(0, 0, 0, .55);
      animation: rise .22s cubic-bezier(.2, .8, .2, 1) both;
    }
    /* The extension's blue: it breathes while you type, runs round once when you send. */
    .bar::after {
      content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
      box-shadow: inset 0 0 0 1.5px rgba(var(--glow), .0), 0 0 0 rgba(var(--glow), 0);
      transition: box-shadow .35s ease;
    }
    .bar.typing::after { box-shadow: inset 0 0 0 1.5px rgba(var(--glow), .55), 0 0 24px rgba(var(--glow), .18); }
    .bar.sent::after { animation: sent .45s ease forwards; }
    /* Braino himself on the left, bobbing a little, not an orb. */
    .mascot { flex: none; width: 40px; height: 40px; margin-left: -6px; animation: bob 2.8s ease-in-out infinite; }
    .mascot svg { width: 100%; height: 100%; overflow: visible; }
    input {
      flex: 1; min-width: 0; border: 0; outline: 0; background: none;
      color: var(--ink); caret-color: rgb(var(--glow));
      font: 400 21px/1.2 "SF Pro Display", -apple-system, sans-serif; letter-spacing: -.01em;
      text-shadow: 0 1px 2px rgba(0, 0, 0, .35);
      -webkit-user-select: text;
    }
    input::placeholder { color: var(--ink-soft); }
    .hint { flex: none; display: flex; gap: 6px; color: var(--ink-soft); font: 500 12px/1 -apple-system, sans-serif; }
    kbd { padding: 3px 6px; border-radius: 6px; background: rgba(255, 255, 255, .14); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .16); font: inherit; color: rgba(255, 255, 255, .78); }
    @keyframes rise { from { opacity: 0; transform: translateY(6px) scale(.985); } to { opacity: 1; transform: none; } }
    @keyframes bob { 50% { transform: translateY(-2px); } }
    @keyframes sent { 0% { box-shadow: inset 0 0 0 1.5px rgba(var(--glow), .9), 0 0 30px rgba(var(--glow), .45); } 100% { box-shadow: inset 0 0 0 1.5px rgba(var(--glow), 0), 0 0 0 rgba(var(--glow), 0); } }
    @media (prefers-reduced-motion: reduce) { .bar, .mascot, .bar.sent::after { animation: none; } }
  </style>
</head>
<body>
  <form class="bar" id="bar" autocomplete="off">
    <span class="mascot" id="mascot" aria-hidden="true"></span>
    <input id="say" type="text" placeholder="Ask Braino, or tell him what to do" aria-label="Type to Braino" spellcheck="true" autofocus />
    <span class="hint" aria-hidden="true"><kbd>↵</kbd><kbd>esc</kbd></span>
  </form>
  <script src="type-bar.js"></script>
</body>
</html>
