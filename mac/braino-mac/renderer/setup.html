<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:; font-src 'self'; media-src 'self' data:" />
  <title>Set up Braino</title>
  <link rel="stylesheet" href="setup.css" />
  <link rel="stylesheet" href="white.css" />
</head>
<body>
  <div class="su-shell">
    <section class="su-left glass" aria-label="Setup">
      <header class="su-top">
        <span class="su-mark">Braino</span>
        <span class="su-progress" id="su-progress"></span>
      </header>
      <div class="su-stage" id="su-stage" aria-live="polite"></div>
      <footer class="su-foot">
        <button type="button" class="su-link" id="su-back">Back</button>
        <span class="su-hint">Everything you tell me, I keep. You'll see it all at the end.</span>
        <button type="button" class="su-link su-sound" id="su-sound">Sound on</button>
      </footer>
    </section>
    <section class="su-right glass" aria-label="Braino's notebook">
      <article class="nb" id="nb"></article>
    </section>
  </div>
  <script src="setup-braino.js"></script>
  <script src="setup.js"></script>
</body>
</html>
