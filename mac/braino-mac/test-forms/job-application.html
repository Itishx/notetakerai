<!doctype html><meta charset="utf-8"><title>Internship application</title>
<style>body{font:16px -apple-system,system-ui;max-width:560px;margin:40px auto;padding:0 16px}.q{margin:18px 0}.q>div{font-weight:600;margin-bottom:6px}input,textarea{width:100%;padding:10px;font:inherit;border:1px solid #bbb;border-radius:8px}fieldset{border:0;padding:0}legend{font-weight:600}button{margin-top:20px;padding:12px 20px;font:inherit}</style>
<h1>Product intern, Summer 2027</h1><p>Test form 2 for Braino. No label tags, placeholders and headings only, like most real sites.</p>
<form onsubmit="event.preventDefault();document.body.insertAdjacentHTML('beforeend','<p><b>Sent.</b></p>')">
<div class="q"><div>Full name</div><input name="applicant" placeholder="Your full name"></div>
<div class="q"><div>Email address</div><input name="contact_mail" placeholder="you@example.com"></div>
<div class="q"><div>Mobile</div><input name="mob" placeholder="+91"></div>
<div class="q"><div>University</div><input name="uni" placeholder="Where you study"></div>
<div class="q"><div>Programme</div><input name="prog" placeholder="Degree or course"></div>
<div class="q"><div>LinkedIn profile</div><input name="li" placeholder="https://linkedin.com/in/..."></div>
<div class="q"><div>GitHub</div><input name="gh" placeholder="https://github.com/..."></div>
<fieldset class="q"><legend>Are you currently a student?</legend><label><input type="radio" name="student" value="yes"> Student</label> <label><input type="radio" name="student" value="no"> Working professional</label></fieldset>
<div class="q"><div>Why this role? (200 words)</div><textarea name="why" rows="4"></textarea></div>
<div class="q"><div>Card number for the application fee</div><input name="cardnumber" placeholder="Never filled by Braino"></div>
<button>Submit application</button></form>
