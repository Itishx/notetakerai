<!doctype html>
<meta charset="utf-8" />
<title>Braino launches</title>
<style>
  /* ========================================================================
     The countdown card.

     One object on a transparent window: warm paper, a hairline, and the
     numbers set in the same serif the company page uses, so the thing sitting
     on the desk all day belongs to the same world as the site.

     Everything sizes off the window rather than off pixels, because the whole
     point is that it can be dragged small into a corner or pulled out big on
     a second screen and stay readable at both.
     ======================================================================== */
  :root {
    --paper: #f4f2ec;
    --card: #fdfcf8;
    --ink: #16150f;
    --soft: #625f54;
    --faint: #918d80;
    --line: #c6c1b1;
    --accent: #d9645b;
    /* One number everything else is a fraction of. */
    --u: clamp(9px, 4.6vw, 30px);
    --display: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --sans: "SF Pro Display", -apple-system, BlinkMacSystemFont, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #17160f;
      --card: #1c1b14;
      --ink: #f6f3ea;
      --soft: rgba(246, 243, 234, .74);
      --faint: rgba(246, 243, 234, .5);
      --line: rgba(246, 243, 234, .22);
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: transparent; }
  body {
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    user-select: none;
    cursor: default;
  }

  .card {
    height: 100%;
    display: flex; flex-direction: column;
    padding: calc(var(--u) * .82) calc(var(--u) * .9);
    background: var(--card);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: calc(var(--u) * .62);
    box-shadow: 0 18px 44px -20px rgba(10, 9, 5, .45);
    overflow: hidden;
    touch-action: none;
  }

  header { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .eyebrow {
    margin: 0;
    font-size: calc(var(--u) * .38);
    font-weight: 600; letter-spacing: .16em; text-transform: uppercase;
    color: var(--faint);
  }
  /* Only there when the pointer is. A widget that is always showing you its
     close button is a widget asking to be closed. */
  .quit {
    appearance: none; border: 0; background: transparent; padding: 0;
    width: calc(var(--u) * .5); height: calc(var(--u) * .5);
    border-radius: 50%; background: var(--line);
    opacity: 0; transition: opacity .18s ease, background .18s ease;
    cursor: pointer;
  }
  body:hover .quit { opacity: .8; }
  .quit:hover { background: var(--accent); opacity: 1; }

  /* The four, across. They wrap on their own when the card is narrow, which
     is the only layout instruction this needs. */
  .rows {
    flex: 1;
    display: flex; align-items: center; justify-content: space-between;
    gap: calc(var(--u) * .3);
    padding: calc(var(--u) * .5) 0 calc(var(--u) * .3);
  }
  .cell { display: flex; flex-direction: column; align-items: center; gap: calc(var(--u) * .1); min-width: 0; }
  .n {
    font-family: var(--display);
    font-size: calc(var(--u) * 1.62);
    line-height: .92;
    letter-spacing: -0.03em;
    font-variant-numeric: tabular-nums;
  }
  .l {
    font-size: calc(var(--u) * .32);
    font-weight: 600; letter-spacing: .14em; text-transform: uppercase;
    color: var(--faint);
  }
  .sep {
    font-family: var(--display);
    font-size: calc(var(--u) * 1.1);
    color: var(--line);
    margin-bottom: calc(var(--u) * .28);
  }

  /* The milliseconds are their own row, because at three digits they move too
     fast to read as a number and are better read as a thing that is moving. */
  .ms-row {
    display: flex; align-items: center; gap: calc(var(--u) * .4);
    padding-top: calc(var(--u) * .42);
    border-top: 1px solid var(--line);
  }
  .ms {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: calc(var(--u) * .46);
    font-variant-numeric: tabular-nums;
    color: var(--accent);
    min-width: 3.4ch;
  }
  .bar { flex: 1; height: 2px; background: var(--line); position: relative; overflow: hidden; }
  .bar i { position: absolute; inset: 0 auto 0 0; background: var(--accent); }
  .when { font-size: calc(var(--u) * .34); color: var(--faint); letter-spacing: .04em; white-space: nowrap; }

  /* The corner. Two hairlines, which is enough to say "pull me". */
  .grip {
    position: fixed; right: 0; bottom: 0;
    width: calc(var(--u) * .9); height: calc(var(--u) * .9);
    cursor: nwse-resize;
    touch-action: none;
  }
  .grip::before, .grip::after {
    content: ""; position: absolute; right: calc(var(--u) * .2); background: var(--line);
    height: 1px; transform: rotate(-45deg); transform-origin: right;
  }
  .grip::before { bottom: calc(var(--u) * .24); width: calc(var(--u) * .34); }
  .grip::after { bottom: calc(var(--u) * .42); width: calc(var(--u) * .2); }

  /* On the wallpaper there is no pointer to speak of: nothing to hover, nothing
     to grab. So the two controls exist only while placing. */
  .quit, .grip { display: none; }
  body.place .quit, body.place .grip { display: block; }

  .done .n { color: var(--accent); }
</style>

<div class="card" id="card">
  <header>
    <p class="eyebrow" id="eyebrow">Braino launches</p>
    <button class="quit" id="quit" title="Close"></button>
  </header>

  <div class="rows" id="rows">
    <div class="cell"><span class="n" id="d">000</span><span class="l">Days</span></div>
    <span class="sep">:</span>
    <div class="cell"><span class="n" id="h">00</span><span class="l">Hrs</span></div>
    <span class="sep">:</span>
    <div class="cell"><span class="n" id="m">00</span><span class="l">Min</span></div>
    <span class="sep">:</span>
    <div class="cell"><span class="n" id="s">00</span><span class="l">Sec</span></div>
  </div>

  <div class="ms-row">
    <span class="ms" id="ms">000</span>
    <span class="bar"><i id="fill"></i></span>
    <span class="when">16 Oct 2026</span>
  </div>
</div>
<div class="grip" id="grip" title="Drag to resize"></div>

<script>
  /* Placing mode is passed in on the URL by main. */
  const PLACING = new URLSearchParams(location.search).has("place");
  if (PLACING) {
    document.body.classList.add("place");
    document.querySelector(".when").textContent = "Drag it, then quit";
  }

  /* Midnight, local, on the sixteenth. */
  const TARGET = new Date(2026, 9, 16, 0, 0, 0, 0).getTime();

  const el = (id) => document.getElementById(id);
  const d = el("d"), h = el("h"), m = el("m"), s = el("s"), ms = el("ms"), fill = el("fill");
  const card = el("card"), eyebrow = el("eyebrow");
  const pad = (n, width) => String(Math.floor(n)).padStart(width, "0");

  /* Drawn every frame rather than every second, because the milliseconds are
     the point: a countdown that ticks once a second reads as a clock, and a
     countdown that never stops moving reads as a deadline. */
  function draw() {
    const left = TARGET - Date.now();
    if (left <= 0) {
      card.classList.add("done");
      eyebrow.textContent = "Braino is out";
      d.textContent = "16";
      h.textContent = "10";
      m.textContent = "20";
      s.textContent = "26";
      ms.textContent = "000";
      fill.style.width = "100%";
      return requestAnimationFrame(draw);
    }
    const sec = left / 1000;
    d.textContent = pad(sec / 86400, 2);
    h.textContent = pad((sec / 3600) % 24, 2);
    m.textContent = pad((sec / 60) % 60, 2);
    s.textContent = pad(sec % 60, 2);
    const milli = left % 1000;
    ms.textContent = pad(milli, 3);
    /* The bar fills across the second it is currently inside, so the card is
       always doing something even when nothing has changed. */
    fill.style.width = `${(1 - milli / 1000) * 100}%`;
    requestAnimationFrame(draw);
  }
  draw();

  /* Dragging and resizing both go through main, because the window is
     unfocusable so it never takes the caret from whatever is being typed
     into, and an unfocusable window does not get to drag itself.

     Pointer capture rather than plain mouse events: a flick fast enough to
     outrun the window would otherwise leave the card behind, and a mouseup
     landing outside the window would never arrive, so the thing would stay
     stuck to the cursor. Captured, every move and the release come back here
     wherever the pointer actually is. */
  const hold = (node, api) => {
    let id = null;
    node.addEventListener("pointerdown", (e) => {
      if (e.button !== 0 || id !== null) return;
      id = e.pointerId;
      node.setPointerCapture(id);
      window.widget[api + "Start"]();
      e.preventDefault();
    });
    node.addEventListener("pointermove", (e) => {
      if (e.pointerId === id) window.widget[api + "Move"]();
    });
    const release = (e) => {
      if (e.pointerId !== id) return;
      try { node.releasePointerCapture(id); } catch (_) {}
      id = null;
      window.widget[api + "End"]();
    };
    node.addEventListener("pointerup", release);
    node.addEventListener("pointercancel", release);
  };
  hold(card, "drag");
  hold(el("grip"), "size");
  el("quit").addEventListener("pointerdown", (e) => e.stopPropagation());
  el("quit").addEventListener("click", () => window.widget.quit());
</script>
