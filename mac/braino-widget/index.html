<!doctype html>
<meta charset="utf-8" />
<title>Braino launches</title>
<style>
  /* ========================================================================
     Braino at the right edge, and the countdown that comes out of him.

     There is no card and no ground. The window is transparent and almost all
     of it is empty, so the only things ever on screen are a sliver of him and,
     when he is clicked, the numbers. Everything is drawn in his own coral,
     which is the one colour that stays legible on a white document and on a
     dark wallpaper alike, so the thing never needs a panel behind it.
     ======================================================================== */
  :root {
    --coral: #e0695c;
    --coral-deep: #a9504a;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --sans: "SF Pro Text", -apple-system, BlinkMacSystemFont, sans-serif;
    /* One shadow, on everything, so each glyph carries its own contrast
       instead of the page carrying a background. */
    --lift: 0 1px 2px rgba(20, 8, 6, .42), 0 0 10px rgba(20, 8, 6, .18);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: transparent; overflow: hidden; }
  body {
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    user-select: none;
    cursor: default;
  }

  /* ---- Braino, leaning in past the edge of the screen ------------------- */
  /* The sliver is narrower than he is and clips the rest, so he reads as
     continuing off the side of the display rather than as a small drawing
     that happens to be parked there. */
  .nub {
    position: absolute; right: 0; top: 50%;
    width: 50px; height: 112px;
    margin-top: -56px;
    overflow: hidden;
    cursor: pointer;
    transform-origin: right center;
    transition: transform .26s cubic-bezier(.2, .9, .3, 1);
  }
  .nub svg { position: absolute; left: 0; top: -18px; width: 98px; height: auto; display: block; }
  body.press .nub { transform: scale(.9); }
  body.open .nub { transform: translateX(-1px); }

  /* Only there when the pointer is, and only on him. */
  .quit {
    position: absolute; right: 6px; top: 2px; z-index: 2;
    appearance: none; border: 0; padding: 0;
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--coral-deep);
    opacity: 0; transition: opacity .16s ease;
    cursor: pointer;
  }
  body.hot .quit { opacity: .55; }
  .quit:hover { opacity: 1; }

  /* ---- The numbers ------------------------------------------------------ */
  /* Anchored at his side and clipped from that same edge, so opening reads as
     the row being drawn out of him rather than appearing beside him. The
     overshoot in the curve is the whole feel: it arrives slightly too far and
     settles, the way a held control on a phone springs open. */
  .panel {
    position: absolute; right: 50px; top: 50%;
    transform: translateY(-50%) scale(.82);
    transform-origin: right center;
    clip-path: inset(0 0 0 100%);
    opacity: 0;
    pointer-events: none;
    transition:
      transform .44s cubic-bezier(.17, 1.22, .32, 1),
      clip-path .44s cubic-bezier(.17, 1.22, .32, 1),
      opacity .16s ease .04s;
  }
  body.open .panel {
    transform: translateY(-50%) scale(1);
    clip-path: inset(0 0 0 0%);
    opacity: 1;
  }
  /* Closing is not a spring. It gets out of the way. */
  body:not(.open) .panel { transition-duration: .2s, .2s, .12s; transition-timing-function: cubic-bezier(.4, 0, 1, 1); }

  .row { display: flex; align-items: flex-end; gap: 7px; padding-right: 4px; }

  .cell {
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    /* Each cell arrives just after the one to its right, so the row unrolls. */
    opacity: 0; transform: translateX(12px);
    transition: opacity .26s ease, transform .34s cubic-bezier(.2, .9, .3, 1);
  }
  body.open .cell {
    opacity: 1; transform: none;
    transition-delay: calc(var(--i) * 45ms + 70ms);
  }
  .n {
    font-family: var(--serif);
    font-size: 31px; line-height: .9; letter-spacing: -0.03em;
    font-variant-numeric: tabular-nums;
    color: var(--coral);
    text-shadow: var(--lift);
  }
  /* The milliseconds ride the seconds rather than taking a row of their own:
     they are not a number to read, they are the proof it is still running. */
  .n .ms {
    font-family: var(--sans);
    font-size: 12px; letter-spacing: 0;
    color: var(--coral-deep);
    opacity: .85;
  }
  .l {
    font-size: 7.5px; font-weight: 600; letter-spacing: .17em; text-transform: uppercase;
    color: var(--coral-deep);
    text-shadow: var(--lift);
  }
  .sep {
    font-family: var(--serif); font-size: 24px; line-height: 1;
    color: var(--coral-deep); opacity: .5;
    padding-bottom: 12px;
    text-shadow: var(--lift);
    opacity: 0;
    transition: opacity .2s ease;
  }
  body.open .sep { opacity: .45; transition-delay: 160ms; }

  @media (prefers-reduced-motion: reduce) {
    .nub, .panel, .cell, .sep { transition-duration: .01ms !important; }
  }
</style>

<div class="panel" id="panel">
  <div class="row">
    <div class="cell" style="--i:3"><span class="n" id="d">00</span><span class="l">Days</span></div>
    <span class="sep">:</span>
    <div class="cell" style="--i:2"><span class="n" id="h">00</span><span class="l">Hrs</span></div>
    <span class="sep">:</span>
    <div class="cell" style="--i:1"><span class="n" id="m">00</span><span class="l">Min</span></div>
    <span class="sep">:</span>
    <div class="cell" style="--i:0"><span class="n"><span id="s">00</span><span class="ms" id="ms">.000</span></span><span class="l">Sec</span></div>
  </div>
</div>

<div class="nub" id="nub">
  <button class="quit" id="quit" title="Quit"></button>
</div>

<script>
  const el = (id) => document.getElementById(id);
  const nub = el("nub");


  /* ---- the count ------------------------------------------------------- */
  /* Midnight, local, on the sixteenth. */
  const TARGET = new Date(2026, 9, 16, 0, 0, 0, 0).getTime();
  const d = el("d"), h = el("h"), m = el("m"), s = el("s"), ms = el("ms");
  const pad = (n, w) => String(Math.floor(n)).padStart(w, "0");

  /* ---- he is alive at the edge ----------------------------------------- */
  /* He arrives from main a beat after the page does. The count is already
     running by then and does not wait for him. */
  let root = null, eyeL = null, eyeR = null;
  Promise.resolve(window.widget?.braino?.() ?? "").then((svg) => {
    if (!svg) return;
    nub.insertAdjacentHTML("beforeend", svg);
    root = nub.querySelector("#__sbwk_root__");
    eyeL = nub.querySelector("#__sbwk_eye_l__");
    eyeR = nub.querySelector("#__sbwk_eye_r__");
  }).catch(() => {});
  const still = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  const start = performance.now();
  function frame(now) {
    const left = TARGET - Date.now();
    if (left <= 0) {
      d.textContent = "00"; h.textContent = "00"; m.textContent = "00";
      s.textContent = "00"; ms.textContent = ".000";
    } else {
      const sec = left / 1000;
      d.textContent = pad(sec / 86400, 2);
      h.textContent = pad((sec / 3600) % 24, 2);
      m.textContent = pad((sec / 60) % 60, 2);
      s.textContent = pad(sec % 60, 2);
      ms.textContent = "." + pad(left % 1000, 3);
    }

    if (!still && root) {
      const t = (now - start) / 1000;
      /* Breath, a slow lean toward the screen, and a blink every few seconds:
         enough that the sliver never reads as a sticker. */
      const breath = 1 + 0.016 * Math.sin(t * 1.6);
      const lean = Math.sin(t * 0.55) * 1.6;
      const bob = Math.sin(t * 1.6 + 0.6) * 0.9;
      root.setAttribute("transform", `rotate(${lean} 50 100) translate(0 ${bob}) scale(${breath})`);
      const bp = t % 3.9;
      const blink = bp < 0.13 ? Math.sin((bp / 0.13) * Math.PI) : 0;
      const sy = Math.max(0.06, 1 - blink);
      eyeL?.setAttribute("transform", `translate(38,48) scale(1,${sy}) translate(-38,-48)`);
      eyeR?.setAttribute("transform", `translate(62,48) scale(1,${sy}) translate(-62,-48)`);
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  /* ---- open and close --------------------------------------------------- */
  /* It closes itself. The resting state of this thing is a sliver of Braino
     and nothing else, and it should get back there without being asked. */
  let shutTimer = 0;
  const arm = () => { clearTimeout(shutTimer); shutTimer = setTimeout(() => document.body.classList.remove("open"), 7000); };

  nub.addEventListener("click", () => {
    const open = document.body.classList.toggle("open");
    if (open) arm(); else clearTimeout(shutTimer);
  });
  nub.addEventListener("pointerdown", () => document.body.classList.add("press"));
  const unpress = () => document.body.classList.remove("press");
  window.addEventListener("pointerup", unpress);
  window.addEventListener("pointercancel", unpress);

  /* ---- claiming the pointer, and giving it straight back ---------------- */
  /* The window is click-through so it can sit over real work all day. It takes
     the pointer only while it is genuinely over him, which is the only part of
     this window that is not empty. */
  let hot = false;
  const cool = () => {
    if (!hot) return;
    hot = false;
    document.body.classList.remove("hot");
    unpress();
    if (document.body.classList.contains("open")) arm();
  };
  const warm = () => {
    if (hot) return;
    hot = true;
    document.body.classList.add("hot");
    clearTimeout(shutTimer);
    const b = nub.getBoundingClientRect();
    window.widget?.hot({ x: b.left, y: b.top, w: b.width, h: b.height });
  };
  /* Main decides when it is over: it can see the real cursor even when this
     page has stopped being sent events. */
  window.widget?.onCold?.(cool);

  const overNub = (x, y) => {
    const b = nub.getBoundingClientRect();
    return x >= b.left && x <= b.right && y >= b.top && y <= b.bottom;
  };
  window.addEventListener("mousemove", (e) => { if (overNub(e.clientX, e.clientY)) warm(); });

  el("quit").addEventListener("click", (e) => { e.stopPropagation(); window.widget?.quit(); });
</script>
