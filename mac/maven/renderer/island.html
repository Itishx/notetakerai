<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src https://*.supabase.co; media-src 'self' blob: data:">
<link rel="stylesheet" href="island.css">
</head>
<body class="a-right">
  <!-- Maven's presence (2026-10-26): a small capsule with two eyes. Resting it
       blinks, listening a warm light runs round it, done it turns green.
       2026-10-27: Do mode. When there are words to see (a draft, a choice), the
       capsule grows into the island card right where it sits, then folds back. -->
  <div id="island" class="on idle" aria-label="Maven">
    <button type="button" class="x" aria-label="Cancel">✕</button>
    <div class="face">
      <span class="eye"><i></i><i></i><i></i><i></i></span>
      <span class="eye"><i></i><i></i><i></i><i></i></span>
      <canvas class="edge" width="200" height="120" aria-hidden="true"></canvas>
      <span class="wave" aria-hidden="true"><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b></span>
    </div>
    <button type="button" class="ok" aria-label="Done">✓</button>
  </div>
  <div id="note" role="status" aria-live="polite"></div>
  <div id="hint" aria-live="polite"></div>

  <div id="cardwrap">
    <div id="card" role="dialog" aria-live="polite">
      <div class="ceyes" aria-hidden="true"><span></span><span></span></div>
      <div class="body">
        <div class="lbl"><b class="title"></b><span class="right"></span></div>
        <div class="preview"></div>
        <textarea class="editor" rows="3" spellcheck="true"></textarea>
        <div class="opts"></div>
        <div class="jobs"></div>
        <div class="acts">
          <button type="button" class="yes"><span class="ptxt">Send</span><kbd>⏎</kbd></button>
          <button type="button" class="edit">Edit</button>
          <button type="button" class="no">Cancel<kbd>esc</kbd></button>
        </div>
      </div>
      <div class="sentlbl"></div>
    </div>
  </div>
  <script src="vendor/affectiveos-voice.js"></script>
  <script src="island.js"></script>
  <script src="maven-character.js"></script>
</body>
</html>
