<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Braino — Microphone</title>
  <style>
    :root { color-scheme: light dark; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: radial-gradient(120% 120% at 50% 0%, #2a1410 0%, #160b09 60%, #0e0706 100%);
      color: #f6ece9;
      display: flex; align-items: center; justify-content: center;
      padding: 22px; box-sizing: border-box;
    }
    .card { max-width: 360px; text-align: center; }
    .mascot {
      width: 64px; height: 64px; margin: 0 auto 14px;
      border-radius: 18px;
      background: linear-gradient(135deg, #ff7a59, #c8544a);
      box-shadow: 0 8px 28px rgba(200,84,74,0.5);
      display: flex; align-items: center; justify-content: center;
      font-size: 30px;
    }
    h1 { font-size: 17px; margin: 0 0 8px; font-weight: 650; }
    p { font-size: 13.5px; line-height: 1.5; margin: 0 0 18px; color: #d8c6c1; }
    button {
      appearance: none; border: 0; cursor: pointer;
      background: linear-gradient(135deg, #ff7a59, #c8544a);
      color: #fff; font-size: 14px; font-weight: 600;
      padding: 11px 20px; border-radius: 12px;
      box-shadow: 0 4px 16px rgba(200,84,74,0.45);
      transition: transform .12s, filter .12s;
    }
    button:hover { transform: translateY(-1px); filter: brightness(1.06); }
    .status { margin-top: 14px; font-size: 12px; color: #b59a93; min-height: 16px; }
    .ok { color: #79e2a8; }
    .err { color: #ff9b8a; }
  </style>
</head>
<body>
  <div class="card">
    <div class="mascot">🎙️</div>
    <h1>Let Braino hear you</h1>
    <p>Voice mode needs microphone access so Braino can listen and follow you across every tab. You only have to do this once.</p>
    <button id="grant">Enable microphone</button>
    <div class="status" id="status"></div>
  </div>
  <script src="mic-permission.js"></script>
</body>
</html>
