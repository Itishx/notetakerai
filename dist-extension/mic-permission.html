<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Braino — Microphone</title>
  <style>
    :root {
      color-scheme: dark;
      --coral: #E8786E;
      --coral-soft: #F6A8A2;
      --coral-deep: #C9544A;
      --ink: #F6ECE9;
      --ink-dim: #D8C6C1;
    }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background:
        radial-gradient(120% 90% at 50% -10%, rgba(232,120,110,0.32) 0%, rgba(232,120,110,0) 58%),
        linear-gradient(180deg, #241110 0%, #1c0e0b 46%, #140908 100%);
      color: var(--ink);
      display: flex; align-items: center; justify-content: center;
      padding: 20px 22px; box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
    }
    .card { max-width: 340px; text-align: center; }
    .mic {
      width: 58px; height: 58px; margin: 0 auto 14px;
      border-radius: 50%;
      background: linear-gradient(160deg, var(--coral-soft) 0%, var(--coral) 55%, var(--coral-deep) 100%);
      box-shadow: 0 10px 30px rgba(201,84,74,0.5), inset 0 1px 0 rgba(255,255,255,0.35);
      display: flex; align-items: center; justify-content: center;
      position: relative;
    }
    .mic::after {
      content: ""; position: absolute; inset: -9px;
      border-radius: 50%;
      border: 1.5px solid rgba(232,120,110,0.35);
      animation: sonar 2.4s cubic-bezier(.22,1,.36,1) infinite;
    }
    @keyframes sonar {
      0%   { transform: scale(0.86); opacity: 0; }
      28%  { opacity: 1; }
      100% { transform: scale(1.22); opacity: 0; }
    }
    .mic svg { width: 26px; height: 26px; display: block; }
    h1 { font-size: 17.5px; letter-spacing: -0.01em; margin: 0 0 7px; font-weight: 650; }
    p { font-size: 13.5px; line-height: 1.55; margin: 0 0 18px; color: var(--ink-dim); }
    button {
      appearance: none; border: 0; cursor: pointer;
      background: linear-gradient(160deg, var(--coral-soft) 0%, var(--coral) 55%, var(--coral-deep) 100%);
      color: #fff; font-size: 14px; font-weight: 650; letter-spacing: 0.01em;
      padding: 12px 26px; border-radius: 999px;
      box-shadow: 0 6px 20px rgba(201,84,74,0.45), inset 0 1px 0 rgba(255,255,255,0.3);
      transition: transform .14s cubic-bezier(.22,1,.36,1), filter .14s;
    }
    button:hover { transform: translateY(-1px); filter: brightness(1.06); }
    button:active { transform: translateY(0); filter: brightness(0.98); }
    button:disabled { opacity: 0.6; cursor: default; transform: none; }
    .status { margin-top: 13px; font-size: 12px; color: #B59A93; min-height: 16px; }
    .ok { color: #79E2A8; }
    .err { color: #FF9B8A; }
  </style>
</head>
<body>
  <div class="card">
    <div class="mic" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="9" y="3" width="6" height="11" rx="3" fill="#fff"/>
        <path d="M5.5 11.5a6.5 6.5 0 0 0 13 0" stroke="#fff" stroke-width="1.8" stroke-linecap="round" fill="none"/>
        <path d="M12 18v3" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </div>
    <h1>Braino needs your microphone</h1>
    <p>A one-time permission so you can talk to Braino on any page. He listens only when you wake him.</p>
    <button id="grant">Allow microphone</button>
    <div class="status" id="status"></div>
  </div>
  <script src="mic-permission.js"></script>
</body>
</html>
