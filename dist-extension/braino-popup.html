<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Braino</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 380px;
      height: 560px;
      overflow: hidden;
      background: transparent;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      padding: 8px;
      display: flex;
      flex-direction: column;
    }

    /* ── Floating card ── */
    .bp-card {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: rgba(255, 251, 247, 0.97);
      border-radius: 22px;
      border: 1px solid rgba(65, 48, 40, 0.09);
      box-shadow:
        0 8px 28px rgba(27, 23, 19, 0.16),
        0 24px 56px rgba(27, 23, 19, 0.13);
      overflow: hidden;
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
    }

    /* ── Header ── */
    .bp-header {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 11px 13px;
      border-bottom: 1px solid rgba(65, 48, 40, 0.07);
      background: rgba(255, 251, 247, 0.99);
      flex-shrink: 0;
    }

    .bp-brain {
      width: 28px;
      height: 28px;
      flex-shrink: 0;
      filter: drop-shadow(0 2px 8px rgba(200, 84, 74, 0.35));
      animation: bpBrainGlow 3.8s ease-in-out infinite;
    }

    @keyframes bpBrainGlow {
      0%, 100% { filter: drop-shadow(0 2px 8px rgba(200, 84, 74, 0.25)); }
      50%       { filter: drop-shadow(0 0 16px rgba(232, 120, 110, 0.9)) drop-shadow(0 0 32px rgba(200, 84, 74, 0.5)); }
    }

    .bp-brand {
      font-size: 13.5px;
      font-weight: 600;
      letter-spacing: -0.015em;
      color: #1B1713;
      line-height: 1;
    }
    .bp-brand span { color: oklch(0.58 0.19 45); }

    .bp-restricted-badge {
      font-size: 9.5px;
      font-weight: 500;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #B8AFA4;
      background: rgba(65, 48, 40, 0.06);
      border: 1px solid rgba(65, 48, 40, 0.09);
      border-radius: 5px;
      padding: 2px 6px;
      white-space: nowrap;
    }

    .bp-header-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .bp-username {
      font-size: 11.5px;
      color: #8A7F75;
      display: none;
      white-space: nowrap;
      max-width: 80px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #bpSignInBtn {
      font-size: 11.5px;
      font-weight: 600;
      color: white;
      background: #E8786E;
      border: none;
      border-radius: 20px;
      padding: 5px 13px;
      cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
    }
    #bpSignInBtn:hover { background: #C9544A; }

    /* ── Messages area ── */
    .bp-messages {
      flex: 1;
      overflow-y: auto;
      padding: 12px 13px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      scroll-behavior: smooth;
    }

    .bp-messages::-webkit-scrollbar { width: 3px; }
    .bp-messages::-webkit-scrollbar-track { background: transparent; }
    .bp-messages::-webkit-scrollbar-thumb { background: rgba(65,48,40,0.15); border-radius: 99px; }

    /* ── Empty state ── */
    .bp-empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 11px;
      padding: 20px 20px;
      text-align: center;
    }

    .bp-empty-icon {
      width: 62px;
      height: 62px;
      filter: drop-shadow(0 2px 12px rgba(200, 84, 74, 0.4));
      animation: bpBrainGlow 3.8s ease-in-out infinite;
    }

    .bp-empty-title {
      font-size: 15px;
      font-weight: 600;
      color: #1B1713;
      letter-spacing: -0.01em;
    }

    .bp-empty-sub {
      font-size: 12.5px;
      color: #A79B92;
      line-height: 1.5;
      max-width: 220px;
    }

    /* ── Chat bubbles ── */
    .bp-msg {
      max-width: 90%;
      padding: 9px 12px;
      font-size: 13.5px;
      line-height: 1.58;
      word-break: break-word;
    }

    .bp-msg-user {
      align-self: flex-end;
      background: rgba(232, 120, 110, 0.13);
      color: #1B1713;
      border-radius: 14px 14px 4px 14px;
    }

    .bp-msg-assistant {
      align-self: flex-start;
      background: rgba(65, 48, 40, 0.055);
      color: #1B1713;
      border-radius: 4px 14px 14px 14px;
    }

    .bp-msg-assistant code {
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 12px;
      background: rgba(65, 48, 40, 0.08);
      padding: 1px 5px;
      border-radius: 4px;
    }

    .bp-msg-assistant strong { font-weight: 600; }
    .bp-msg-assistant em { font-style: italic; }

    .bp-msg-assistant p + p { margin-top: 6px; }

    .bp-thinking {
      opacity: 0.5;
      font-style: italic;
      font-size: 13px;
    }

    .bp-msg-error {
      align-self: flex-start;
      background: oklch(0.94 0.05 25);
      color: oklch(0.45 0.18 25);
      border-radius: 4px 14px 14px 14px;
    }

    /* ── Input bar ── */
    .bp-bar {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 10px 13px;
      border-top: 1px solid rgba(65, 48, 40, 0.07);
      background: rgba(255, 251, 247, 0.99);
      flex-shrink: 0;
    }

    #bpInput {
      flex: 1;
      border: none;
      outline: none;
      background: transparent;
      font-size: 13.5px;
      color: #1B1713;
      font-family: inherit;
      padding: 0;
      line-height: 1.4;
      min-width: 0;
    }
    #bpInput::placeholder { color: #A79B92; }
    #bpInput:disabled { opacity: 0.5; }

    #bpSendBtn {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: none;
      background: #E8786E;
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s, opacity 0.15s;
      padding: 0;
    }
    #bpSendBtn:hover { background: #C9544A; }
    #bpSendBtn:disabled { opacity: 0.45; cursor: default; background: #E8786E; }
  </style>
</head>
<body>
  <div class="bp-card">

    <!-- Header -->
    <div class="bp-header">
      <img src="icon128.png" class="bp-brain" alt="Braino" />
      <span class="bp-brand"><b>side</b><span>brain</span></span>
      <span class="bp-restricted-badge">general</span>
      <div class="bp-header-right">
        <span id="bpUserName" class="bp-username"></span>
        <button id="bpSignInBtn">Sign in</button>
      </div>
    </div>

    <!-- Messages -->
    <div id="bpMessages" class="bp-messages">
      <div id="bpEmpty" class="bp-empty">
        <img src="icon128.png" class="bp-empty-icon" alt="Braino" />
        <span class="bp-empty-title">Ask me anything</span>
        <span class="bp-empty-sub">General AI chat · works on every page including restricted ones</span>
      </div>
    </div>

    <!-- Input bar -->
    <div class="bp-bar">
      <input id="bpInput" type="text" placeholder="Ask anything…" autocomplete="off" spellcheck="false" />
      <button id="bpSendBtn" title="Send">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="19" x2="12" y2="5"/>
          <polyline points="5 12 12 5 19 12"/>
        </svg>
      </button>
    </div>

  </div>
  <script src="braino-popup.js"></script>
</body>
</html>
